name: Site checks
on:
  pull_request:
    paths: ['site/**', 'build/**', 'data/splits/**', 'data/public/**', 'tests/check_site_dist.py', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', 'build/**', 'data/splits/**', 'data/public/**', 'tests/check_site_dist.py', '.github/workflows/site.yml']
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
        working-directory: .
      - name: Rebuild and validate site inputs
        working-directory: .
        run: |
          bash build/build_all.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: python ../tests/check_site_dist.py dist
