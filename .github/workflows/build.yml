name: Data build
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore and checksum published inputs and rosters
        run: bash build/fetch_inputs.sh
      - run: python -m unittest discover -s tests -p 'test_inputs_restore.py'
      - name: Build and verify budgets
        run: |
          build/build_all.sh
          python build/verify_db.py
      - name: Export and validate site data
        run: python build/validate_site_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: checked-budget-database
          path: data/budget.db
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: hashFiles('site/public/data/**') != ''
        with:
          name: checked-site-data
          path: site/public/data/
          retention-days: 7
